name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: 服务端 typecheck / 测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inca-treasure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: inca-treasure/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试 + 冒烟测试
        run: npm test

  client:
    name: Flutter 分析 / 测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inca-treasure-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 构建 Web 产物
        run: flutter build web --release
